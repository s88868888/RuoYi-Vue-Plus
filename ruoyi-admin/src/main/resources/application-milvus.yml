# Milvus 向量数据库配置
milvus:
  # 是否启用 Milvus
  enabled: true
  # Milvus 服务器地址
  host: 192.168.169.205
  # Milvus 服务器端口
  port: 19530
  # 数据库名称
  database: default
  # 连接超时时间（毫秒）
  connect-timeout: 10000
  # 保持连接时间（毫秒）
  keep-alive-time: 55000
  # 向量维度（DashScope text-embedding-v1 模型为 1536 维）
  dimension: 1536
  # 集合名称前缀
  collection-prefix: company_

# Spring AI Alibaba 配置
spring:
  ai:
    dashscope:
      # 阿里云 DashScope API Key（需要在阿里云控制台获取）
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      embedding:
        # 使用的 embedding 模型
        model: text-embedding-v1
        # 是否启用
        enabled: true
