--- # Milvus 向量数据库配置
milvus:
  # 是否启用 Milvus
  enabled: true
  # Milvus 服务器地址
  host: 192.168.169.205
  # Milvus 服务器端口
  port: 19530
  # 数据库名称
  database: default
  # 连接超时时间（毫秒）
  connect-timeout: 10000
  # 保持连接时间（毫秒）
  keep-alive-time: 55000
  # 向量维度（text-embedding-v4 模型为 1024 维）
  dimension: 1024
  # 集合名称前缀
  collection-prefix: company_

--- # AI 调用退避重试配置（针对 429 限流/配额超限）
ai:
  retry:
    # 最大重试次数（含首次调用）
    max-attempts: 5
    # 初始退避时间（毫秒）
    initial-backoff-ms: 2000
    # 退避倍数（指数退避：2s → 4s → 8s → 16s）
    backoff-multiplier: 2.0
    # 最大退避时间（毫秒），60秒封顶
    max-backoff-ms: 60000

--- # Spring AI Alibaba 配置
spring:
  ai:
    retry:
      # Spring AI 内置重试（仅对 TransientAiException 生效，429 由 AiChatService 自行处理）
      max-attempts: 3
    dashscope:
      # 阿里云 DashScope API Key
      api-key: ${DASHSCOPE_API_KEY:sk-1da7f2d8b5ec4c1bac0418125f728195}
      # HTTP 客户端超时配置（AI模型响应慢，需要更长超时时间）
      http-client:
        # 读取超时时间（毫秒），120秒
        read-timeout: 120000
        # 连接超时时间（毫秒），30秒
        connect-timeout: 30000
      # Chat 模型配置
      chat:
        options:
          # 使用 qwen-long 模型
          model: qwen-long-latest
          # 温度参数，控制输出的随机性
          temperature: 0.7
      # Embedding 模型配置
      embedding:
        # 使用的 embedding 模型
        model: text-embedding-v4
        # 是否启用
        enabled: true

--- # 智能审核 - 本地大模型与 OCR 配置
review:
  # 文本对比阶段的本地 Ollama 通道
  ai:
    local:
      # 是否启用本地 Ollama 通道（启用后才会注册 OllamaChatModel Bean）
      enabled: true
      # Ollama 服务地址（4090 服务器，已部署 qwen3.6:35b-a3b-q4_K_M）
      base-url: http://192.168.169.205:11434
      # 默认模型（prompt 模板的 model_name 留空时使用）
      model: qwen3.6:35b-a3b-q4_K_M
      # 上下文窗口（token 数），4090 24GB + flash-attn 推荐 32768，prompt+output 都吃这里
      num-ctx: 32768
      # 单次推理输出 token 上限（防止本地 MoE 模型退化重复无限生成）
      num-predict: 8000
      # 温度参数，审核场景需要稳定输出
      temperature: 0.2
      # top_p
      top-p: 0.8
      # 调用超时时间（毫秒），35B 模型生成 18 页 JSON 约 30~60 秒，5 分钟封顶
      timeout-ms: 300000
  # 扫描件 OCR 阶段
  ocr:
    # 当前 Provider，可选：qwen-vl（云端，默认）/ paddleocr（本地）
    provider: paddleocr
    # PaddleOCR 配置（provider=paddleocr 时启用）
    paddleocr:
      url: http://192.168.169.205:8086/ocr
      timeout-ms: 60000
      confidence-threshold: 0.5
  # 任务完成 Webhook 回调（替代调用方轮询）
  webhook:
    # 共享密钥，外部系统验签时必须使用同一个值
    secret: cs-review-webhook-secret-2026
    # HTTP 客户端超时（毫秒）
    timeout-ms: 10000
    # 失败重试次数（指数退避：2s / 5s / 10s）
    max-retries: 3
